<div class="login-shell">
  <!-- Left: Branding -->
  <aside class="branding-column">
    <div class="branding-column__body">
      <figure class="branding-column__logo" aria-label="SafeFlow logo">
        <img src="logo-safeflow.png" alt="SafeFlow" />
      </figure>

      <p class="branding-column__slogan">
        Seguridad que no te detiene y fluidez que te da confianza.
      </p>

      <div class="branding-column__location">
        <svg lucideMapPin width="14" height="14" aria-hidden="true" />
        <span>Soacha</span>
      </div>
    </div>

    <footer class="branding-column__footer">
      &copy; 2024 SAFE FLOW. PREMIUM RESIDENTIAL PARKING MANAGEMENT.
    </footer>
  </aside>

  <!-- Right: Login Form -->
  <main class="login-column">
    <div class="login-column__header">
      <a class="login-column__back" routerLink="/">
        <svg lucideArrowLeft width="16" height="16" aria-hidden="true" />
        Volver al Inicio
      </a>
    </div>

    <div class="login-column__body">
      <h2 class="login-column__title">Iniciar sesi&oacute;n</h2>
      <p class="login-column__subtitle">Bienvenido de nuevo al sistema Safe Flow</p>

      <form class="login-form" (submit)="onSubmit($event)">
        <!-- Email field -->
        <div class="form-field">
          <label class="form-field__label" for="email"
            >CORREO ELECTR&Oacute;NICO O USUARIO</label
          >
          <div class="form-field__input">
            <svg
              lucideMail
              width="16"
              height="16"
              class="form-field__icon"
              aria-hidden="true"
            />
            <input
              id="email"
              name="email"
              type="email"
              placeholder="nombre@empresa.com"
              autocomplete="email"
            />
          </div>
        </div>

        <!-- Password field -->
        <div class="form-field">
          <div class="form-field__header">
            <label class="form-field__label" for="password">CONTRASE&Ntilde;A</label>
            <a class="form-field__forgot" tabindex="0"
              >&iquest;Olvidaste la contrase&ntilde;a?</a
            >
          </div>
          <div class="form-field__input">
            <svg
              lucideLockKeyhole
              width="16"
              height="16"
              class="form-field__icon"
              aria-hidden="true"
            />
            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Ingresa tu contrase&ntilde;a"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="form-field__toggle"
              (click)="togglePassword()"
              [attr.aria-label]="
                showPassword ? 'Ocultar contrase&ntilde;a' : 'Mostrar contrase&ntilde;a'
              "
            >
              @if (showPassword) {
                <svg lucideEyeOff width="16" height="16" aria-hidden="true" />
              } @else {
                <svg lucideEye width="16" height="16" aria-hidden="true" />
              }
            </button>
          </div>
        </div>

        <!-- Checkbox -->
        <label class="form-field__checkbox">
          <input type="checkbox" name="remember" />
          <span>Mantener sesi&oacute;n iniciada</span>
        </label>

        <!-- Submit -->
        <button type="submit" class="login-form__submit">
          <span>Iniciar sesi&oacute;n</span>
          <svg lucideArrowRight width="18" height="18" aria-hidden="true" />
        </button>
      </form>

      <p class="login-column__support">
        &iquest;Tienes problemas para acceder?
        <a class="login-column__support-link" tabindex="0">Contactar Soporte</a>
      </p>
    </div>
  </main>
</div>
